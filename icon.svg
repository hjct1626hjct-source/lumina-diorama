<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f233c"/>
      <stop offset="55%" stop-color="#14324a"/>
      <stop offset="100%" stop-color="#193c32"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="45%" stop-color="#f5c85b"/>
      <stop offset="100%" stop-color="#b47b21"/>
    </linearGradient>
    <linearGradient id="blade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="crystal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="45%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="90" fill="none" stroke="url(#gold)" stroke-width="5" opacity="0.65"/>
  <!-- Soft golden atmospheric sun halo -->
  <circle cx="256" cy="240" r="168" fill="#fbbf24" opacity="0.14"/>
  <!-- Royal Fantasy Crest Shield -->
  <path d="M256,88 L392,148 L374,306 C364,370 318,418 256,446 C194,418 148,370 138,306 L120,148 Z" fill="#172c48" stroke="url(#gold)" stroke-width="10"/>
  <!-- Winged Crest Flourish -->
  <path d="M150,210 L218,242 L256,222 L294,242 L362,210 L330,278 L256,258 L182,278 Z" fill="url(#gold)" opacity="0.9"/>
  <!-- Legendary Blade -->
  <polygon points="256,64 274,284 256,304 238,284" fill="url(#blade)" stroke="#e0f2fe" stroke-width="3"/>
  <path d="M196,286 L256,268 L316,286 L300,304 L256,294 L212,304 Z" fill="url(#gold)"/>
  <rect x="247" y="294" width="18" height="62" rx="6" fill="#1e3a8a" stroke="url(#gold)" stroke-width="3"/>
  <circle cx="256" cy="364" r="14" fill="url(#gold)"/>
  <!-- Radiant Star Crystal -->
  <g filter="url(#glow)">
    <polygon points="256,128 292,190 256,238 220,190" fill="url(#crystal)" stroke="#ffffff" stroke-width="3"/>
    <polygon points="256,128 274,190 256,238" fill="#ffffff" opacity="0.35"/>
  </g>
</svg>
